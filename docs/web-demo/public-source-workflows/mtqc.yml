name: MTQC clean-clone verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · offline build and review tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DEMO_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and build browser-local PDF/OCR workers
        working-directory: src/web_demo_client
        run: npm ci && npm run build
      - name: Install browser test dependencies
        working-directory: src/web_demo_browser_tests
        run: npm ci
      - name: Locate Chrome without downloading a test browser
        shell: pwsh
        run: |
          $candidates = if ($IsWindows) {
            @("${env:ProgramFiles}\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          } else {
            @('/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium')
          }
          $chrome = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome is unavailable on this runner.' }
          "CHROME_PATH=$chrome" >> $env:GITHUB_ENV
      - name: .NET server and QC regression suite
        run: dotnet run --project src/web_demo_tests/MedicalQcWebDemoTests.csproj
      - name: Validate editable anatomy specimens and logo-free masters
        run: python src/web_demo/tools/test_servier_fixture.py
      - name: Paired evaluation and release-contract tests
        run: node --test src/web_demo_evaluation/*.test.mjs
      - name: Browser layout, extraction, and two-stage review regression suite
        working-directory: src/web_demo_browser_tests
        run: npm test
      - name: Validate fixture manifest and rights/release prerequisites
        shell: pwsh
        run: |
          dotnet run --project src/web_demo/MedicalQcWebDemo.csproj -- --validate-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Fixture validation failed.' }
          ./scripts/web_demo_release.ps1 -SelfCheck
      - name: Build and scan scoped public export and judge package
        shell: pwsh
        run: ./scripts/web_demo_release.ps1
